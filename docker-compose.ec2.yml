# EC2 runtime compose — pulls pre-built images from ECR (no local build).
# Image pins: .env.images (CI). Host .env: AUTH_API_URL, DI_HTTP_PORT (optional).
# Host nginx proxies di.glassx.ai → 127.0.0.1:8080 (DI_HTTP_PORT).
# GEMINI_API_KEY comes from the host .env below and is server-side only; the platform-setup UI key
# is a separate legacy mechanism serving /api/ask and /api/briefing (ADR-044 Amendment A).

services:
  nextjs-app:
    image: ${DI_NEXTJS_IMAGE}
    container_name: nextjs-app
    restart: unless-stopped
    env_file:
      - path: .env.images
        required: true
      - path: .env
        required: false
    environment:
      - AUTH_API_URL=${AUTH_API_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx-proxy:
    image: ${DI_NGINX_IMAGE}
    container_name: nginx-proxy
    restart: unless-stopped
    env_file:
      - path: .env.images
        required: true
      - path: .env
        required: false
    ports:
      - "${DI_HTTP_PORT:-8080}:80"
    depends_on:
      nextjs-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --no-verbose --tries=1 --spider http://localhost/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

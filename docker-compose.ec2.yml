# EC2 runtime compose — pulls pre-built images from ECR (no local build).
# Image pins: .env.images (CI). Host .env: AUTH_API_URL, DI_HTTP_PORT (optional).
# Host nginx proxies di.glassx.ai → 127.0.0.1:8080 (DI_HTTP_PORT).
# GEMINI_API_KEY comes from the host .env below and is server-side only; the platform-setup UI key
# is a separate legacy mechanism serving /api/ask and /api/briefing (ADR-044 Amendment A).

services:
  cognix-web:
    image: ${DI_COGNIX_WEB_IMAGE}
    container_name: cognix-web
    restart: unless-stopped
    env_file:
      - path: .env.images
        required: true
      - path: .env
        required: false
    environment:
      - AUTH_API_URL=${AUTH_API_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - COGNIX_WORLD_MODE=service
      - COGNIX_WORLD_SERVICE_URL=http://cognix-world:8081
      - LEARNING_SERVICE_URL=http://cognix-learning:8082
    ports:
      - "${DI_HTTP_PORT:-8080}:3000"
    depends_on:
      cognix-world:
        condition: service_healthy
      cognix-learning:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health?type=live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  cognix-world:
    image: ${DI_COGNIX_WORLD_IMAGE}
    container_name: cognix-world
    restart: unless-stopped
    env_file:
      - path: .env.images
        required: true
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8081
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health?type=live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cognix-learning:
    image: ${DI_COGNIX_LEARNING_IMAGE}
    container_name: cognix-learning
    restart: unless-stopped
    env_file:
      - path: .env.images
        required: true
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8082
    expose:
      - "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/api/v1/health?type=live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

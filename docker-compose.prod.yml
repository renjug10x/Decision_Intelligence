services:
  # Nginx reverse proxy gateway (Production overrides)
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        - NGINX_CONF=nginx.prod.conf
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount Let's Encrypt certificates generated by Certbot on host
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Mount certbot challenge webroot folder
      - /var/www/certbot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --no-verbose --tries=1 --spider --no-check-certificate https://localhost/api/health || exit 1"]

  # Automated SSL renewal scheduler (Production only)
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    # Periodically checks for certificate renewals every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

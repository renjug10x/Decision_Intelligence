services:
  cognix-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        AUTH_API_URL: ${AUTH_API_URL:-}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL:-${AUTH_API_URL:-}}
    container_name: cognix-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - AUTH_API_URL=${AUTH_API_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - COGNIX_WORLD_MODE=service
      - COGNIX_WORLD_SERVICE_URL=http://cognix-world:8081
      - LEARNING_SERVICE_URL=http://cognix-learning:8082
      # Google Gemini API key. Server-side only: it is read from the host environment at run
      # time, is never baked into the image, is never sent to the browser and is never accepted
      # from a request body. Set it in the host shell or a .env file beside this compose file —
      # see .env.example for the template.
      #
      # The :- default keeps the stack starting when it is unset; routes that need it fail
      # closed rather than substituting invented content. In particular
      # /api/v1/campaigns/decision-context/suggest returns 503 and drafts nothing when it is
      # missing, so an unset key looks like a disabled assistant, not a broken one.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health?type=live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      cognix-world:
        condition: service_healthy
      cognix-learning:
        condition: service_healthy

  cognix-world:
    build:
      context: .
      dockerfile: docker/Dockerfile.world
    container_name: cognix-world
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  cognix-learning:
    build:
      context: .
      dockerfile: docker/Dockerfile.learning
    container_name: cognix-learning
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=production
      - PORT=8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/api/v1/health?type=live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

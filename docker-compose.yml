services:
  cognix-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: cognix-web
      args:
        AUTH_API_URL: ${AUTH_API_URL:-}
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=production
      - PORT=3000
    # Port 3000 is NOT mapped to the host, preventing public exposure.
    # It is only accessible internally within the Docker Compose network.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Nginx reverse proxy gateway
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        - NGINX_CONF=nginx.local.conf
    container_name: nginx-proxy
    restart: unless-stopped

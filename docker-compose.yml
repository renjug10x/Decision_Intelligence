services:
  cognix-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: cognix-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - COGNIX_WORLD_MODE=service
      - COGNIX_WORLD_SERVICE_URL=http://cognix-world:8081
      - LEARNING_SERVICE_URL=http://cognix-learning:8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health?type=live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - cognix-world
      - cognix-learning

  cognix-world:
    build:
      context: .
      dockerfile: docker/Dockerfile.world
    container_name: cognix-world
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health?type=ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  cognix-learning:
    build:
      context: .
      dockerfile: docker/Dockerfile.learning
    container_name: cognix-learning
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=production
      - PORT=8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
